name: daily-parse
on:
  schedule:
    - cron: "2 4 * * *"  # 07:02 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      BOT_TOKEN_OWNERS: ${{ secrets.BOT_TOKEN_OWNERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверка секретов
        run: |
          ok=1
          for v in BOT_TOKEN BOT_TOKEN_OWNERS; do
            if [ -n "${!v}" ]; then
              echo "$v: заполнен (из Secrets)"
            else
              echo "$v: НЕ задан"
              ok=0
            fi
          done
          if [ "$ok" -eq 0 ]; then
            echo "Не хватает секретов. Задайте их в Settings -> Secrets -> Actions."
            exit 1
          fi
      - run: pip install -r requirements.txt
      - run: python parser_cian.py
      - run: python json_to_db.py
      - run: python vitrina_gen.py
      - name: Backup + restore drill
        run: python db_backup.py listings.db data/listings_backup.sqlite
      - name: Telegram digest (DEPRECATED — Людмила не заходит в Telegram)
        run: python daily_digest.py || true
      - name: Commit database + push to gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f listings.db index.html
          git diff --cached --quiet || git commit -m "daily parse $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          git checkout gh-pages
          git pull
          git checkout main -- index.html
          git add index.html
          git diff --cached --quiet || git commit -m "update vitrina $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push