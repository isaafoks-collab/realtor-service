name: deploy-vps
on:
  workflow_dispatch:
  push:
    branches: [main]
    # изменения кода/конфига системы; база (listings.db) деплой не триггерит
    paths:
      - "runner.py"
      - "parser_cian.py"
      - "parser_yandex.py"
      - "json_to_db.py"
      - "owner_check.py"
      - "httpclient.py"
      - "db_schema.py"
      - "metrics.py"
      - "watchdog_db.py"
      - "cities.py"
      - "geo.py"
      - "bot.py"
      - "access.py"
      - "warm_leads.py"
      - "notify.py"
      - "requirements.txt"
      - "deploy/**"
      - ".github/workflows/deploy-vps.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SRC_HOST: ${{ secrets.VPS_IP }}
      SRC_USER: ${{ secrets.VPS_USER }}
      SRC_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: "Секреты: срезаем CR/LF/пробелы по краям"
        # GitHub Secret мог быть сохранён с завершающим переносом строки —
        # rsync тогда ругается «hostname contains invalid characters».
        # У пароля снимаем только края (пробелы внутри пароля не трогаем).
        run: |
          DEPLOY_HOST="$(printf '%s' "$SRC_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$SRC_USER" | tr -d '[:space:]')"
          SSHPASS="$(printf '%s' "$SRC_PASSWORD" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$SSHPASS" ]; then
            echo "ОШИБКА: секрет VPS_IP / VPS_USER / VPS_PASSWORD пуст после нормализации"
            exit 1
          fi
          echo "после нормализации: хост=${#DEPLOY_HOST} симв., пользователь=${#DEPLOY_USER} симв., пароль=${#SSHPASS} симв."
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$DEPLOY_USER" >> "$GITHUB_ENV"
          echo "SSHPASS=$SSHPASS" >> "$GITHUB_ENV"

      - name: Проверка входа по SSH
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo вход-ок: \$(hostname); mkdir -p /opt/realtor-service"

      - name: Копируем код на сервер
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync
          # listings.db исключён из передачи и из удаления: база живёт на VPS,
          # из репозитория она не приезжает и не стирается
          SSHPASS="$SSHPASS" sshpass -e rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude ".git/" --exclude "data/" --exclude "__pycache__/" \
            --exclude "listings_backup*" --exclude "токены.txt" \
            --exclude "listings.db" \
            --exclude "scheduler.log" --exclude "project_report.txt" \
            --exclude "*.log" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/realtor-service/"

      - name: Готовим файл секретов (на сервер не печатается)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_TOKEN_OWNERS: ${{ secrets.BOT_TOKEN_OWNERS }}
          REALTOR_CHAT_ID: ${{ secrets.REALTOR_CHAT_ID }}
          GITHUB_REPO_TOKEN: ${{ secrets.GITHUB_REPO_TOKEN }}
        run: |
          cat > /tmp/realtor.env <<EOF
          BOT_TOKEN=$BOT_TOKEN
          BOT_TOKEN_OWNERS=$BOT_TOKEN_OWNERS
          REALTOR_CHAT_ID=$REALTOR_CHAT_ID
          GITHUB_REPO_TOKEN=$GITHUB_REPO_TOKEN
          EOF
          SSHPASS="$SSHPASS" sshpass -e rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            /tmp/realtor.env "$DEPLOY_USER@$DEPLOY_HOST:/tmp/realtor.env"
          rm /tmp/realtor.env

      - name: Настраиваем и запускаем
        run: |
          SSHPASS="$SSHPASS" sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /opt/realtor-service/deploy/bootstrap-vps.sh"

      - name: Итог деплоя
        run: echo "деплой завершён"
