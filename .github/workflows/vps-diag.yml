name: vps-diag
on:
  workflow_dispatch:
    inputs:
      diag_cmd:
        description: "Команда для выполнения на VPS"
        required: false
        type: string
      push_test:
        description: "Тест пуша токена с раннера"
        required: false
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SRC_HOST: ${{ secrets.VPS_IP }}
      SRC_USER: ${{ secrets.VPS_USER }}
      SRC_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: "Секреты: срезаем whitespace как в деплое"
        run: |
          DEPLOY_HOST="$(printf '%s' "$SRC_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$SRC_USER" | tr -d '[:space:]')"
          SSHPASS="$(printf '%s' "$SRC_PASSWORD" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$DEPLOY_USER" >> "$GITHUB_ENV"
          echo "SSHPASS=$SSHPASS" >> "$GITHUB_ENV"

      - name: "Диагностика на VPS"
        env:
          DIAG_CMD: ${{ inputs.diag_cmd }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          echo "--- выполняемая команда ---"
          printf '%s\n' "$DIAG_CMD"
          echo "--- вывод с VPS ---"
          SSHPASS="$SSHPASS" sshpass -e ssh \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" "$DIAG_CMD"

      - name: "Push-тест токена с раннера"
        if: inputs.push_test == true
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_REPO_TOKEN || secrets.REPO_TOKEN }}
        run: |
          cd "$(mktemp -d)"
          git init -q .
          git remote add origin "https://isaafoks-collab:$REPO_TOKEN@github.com/isaafoks-collab/realtor-service.git"
          git ls-remote origin main 2>&1 | head -2
          echo "ls-remote rc done"
          git commit -q --allow-empty -m "push-test diag"
          git push --dry-run origin HEAD:main 2>&1 | tail -3
