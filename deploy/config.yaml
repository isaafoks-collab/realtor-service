# Конфиг скоростного контура (Часть A): города, интервалы, часы.
# Правится владельцем без правки кода; runner перечитывает его раз в цикл-ход.
db: listings.db
tick_seconds: 30

push:
  every_minutes: 15

hot:
  cities: [Одинцово]
  interval_minutes: 3      # диапазон 2–5 мин; джиттер ±30 с добавляется сам

moscow:
  cities: [Москва]
  interval_minutes: 15

